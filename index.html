<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de habitos</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
</head>
<body>
    <main class="app-shell">
        <h1>Contador de habitos</h1>
        <p>Estudar JavaScript</p>
        <strong id="valor-contador">0</strong>
        <div>
            <button id="btn-diminuir" type="button">-</button>
            <button id="btn-zerar" type="button">Zerar</button>
            <button id="btn-aumentar" type="button">+</button>
        </div>
        <p id="mensagem" role="status">Pronto para começar.</p>
    </main>
</body>
</html>
