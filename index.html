<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Lista de Tarefas</h1>

    <form id="form-tarefa">
        <input id="entrada-tarefa" type="text" required>
        <button type="submit">Adicionar</button>
    </form>

    <p id="resumo">0 tarefas</p>

    <button class="filtro" data-filtro="todas">Todas</button>
    <button class="filtro" data-filtro="pendentes">Pendentes</button>
    <button class="filtro" data-filtro="concluidas">Concluídas</button>

    <ul id="lista-tarefas"></ul>

    <script src="script.js"></script>
</body>
</html>
